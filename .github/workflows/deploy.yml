name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Pull requests run the same checks and build, but do not deploy.
  pull_request:
  workflow_dispatch:
  # Rebuild once a day so the Music chapter shows fresh Spotify stats (05:23 UTC).
  # GitHub runs schedules from the default branch only, and pauses them after
  # 60 days without activity in the repository.
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: read

# One deployment at a time; a newer push waits rather than cancelling one in progress.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (tag in the comment) so a moved tag cannot
      # change what runs here. Dependabot (.github/dependabot.yml) proposes updates.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (Prettier + ESLint)
        run: npm run lint

      - name: Type-check
        run: npm run check

      # Writes src/lib/data/spotify.json. Skipped without the secrets (forks, pull
      # requests); never fails the build, it keeps the previous data instead.
      - name: Fetch Spotify stats
        if: github.event_name != 'pull_request'
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: node scripts/spotify.js

      - name: Build
        env:
          # The site is served from https://<user>.github.io/<repo>/
          BASE_PATH: '/${{ github.event.repository.name }}'
        run: npm run build

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/ # must match `pages` in svelte.config.js

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
